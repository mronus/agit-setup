name: CI

on: [push, pull_request]

env:
  AGIT_TEST_VERSION: 2.56.0.agit.2
  # A release without prebuilt tarballs.
  AGIT_TEST_BAD_VERSION: 2.56.0.agit.1
  # install.sh installs agit-setup from this commit.
  AGIT_SETUP_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - run: shellcheck -s sh install.sh bin/agit-hook bin/agit-setup test/*.sh

  install:
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-latest
          shell: /bin/bash
        - runner: ubuntu-24.04-arm
          shell: /bin/bash
        - runner: macos-15
          shell: /bin/zsh
        - runner: macos-15-intel
          shell: /bin/zsh
    runs-on: ${{ matrix.runner }}
    env:
      SHELL: ${{ matrix.shell }}
    steps:
    - uses: actions/checkout@v6
    - name: install jq
      run: |
        command -v jq ||
        if command -v brew
        then
          brew install jq
        else
          sudo apt-get -q update &&
          sudo apt-get -q -y install jq
        fi
    - name: install agit for the hook tests
      run: sh install.sh --version "$AGIT_TEST_VERSION" --prefix "$RUNNER_TEMP/agit" --no-modify-path --no-agents
    - run: PATH="$RUNNER_TEMP/agit/current/bin:$PATH" sh test/hook-test.sh
    - run: PATH="$RUNNER_TEMP/agit/current/bin:$PATH" sh test/setup-test.sh
    - run: sh test/install-test.sh "$AGIT_TEST_VERSION" "$AGIT_TEST_BAD_VERSION"

  install-container:
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'fedora:latest']
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    env:
      SHELL: /bin/bash
    steps:
    - name: install curl and jq
      run: |
        if command -v apt-get
        then
          apt-get -q update &&
          apt-get -q -y install curl ca-certificates jq
        else
          dnf -yq install --allowerasing curl ca-certificates tar gzip jq
        fi
    - uses: actions/checkout@v6
    - name: install agit for the hook tests
      run: sh install.sh --version "$AGIT_TEST_VERSION" --prefix "$RUNNER_TEMP/agit" --no-modify-path --no-agents
    - run: PATH="$RUNNER_TEMP/agit/current/bin:$PATH" sh test/hook-test.sh
    - run: PATH="$RUNNER_TEMP/agit/current/bin:$PATH" sh test/setup-test.sh
    - run: sh test/install-test.sh "$AGIT_TEST_VERSION" "$AGIT_TEST_BAD_VERSION"
